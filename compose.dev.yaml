version: '3.8'

services:
  web:
    image: nginx:latest
    volumes:
      # Ganti path relatif './' dengan variabel environment agar bisa diisi dengan absolute path dari host Anda
      - ${HOST_PROJECT_PATH}:/var/www
      - ${HOST_PROJECT_PATH}/docker/development/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    environment:
      - NGINX_HOST=localhost
    networks:
      - laravel-development
    depends_on:
      php-fpm:
        condition: service_started

  php-fpm:
    # PERHATIAN: Jika Dockhand tidak mendukung build dari teks, Anda harus mem-build image ini terlebih dahulu
    # dan mengganti blok 'build' di bawah ini dengan 'image: nama-repo/php-fpm-custom:latest'
    build:
      context: ${HOST_PROJECT_PATH}
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: develop,coverage,debug,profile
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    # Di UI Management, env_file lokal sering gagal terbaca. Lebih aman mendefinisikan environment langsung di UI.
    # env_file:
    #   - .env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${HOST_PROJECT_PATH}:/var/www
    networks:
      - laravel-development
    depends_on:
      postgres:
        condition: service_started

  workspace:
    build:
      context: ${HOST_PROJECT_PATH}
      dockerfile: ./docker/development/workspace/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: develop,coverage,debug,profile
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    ports:
      - "${VITE_PORT:-5173}:5173"
    tty: true
    stdin_open: true
    volumes:
      - ${HOST_PROJECT_PATH}:/var/www
    networks:
      - laravel-development

  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE:-app}
      - POSTGRES_USER=${DB_USERNAME:-laravel}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - postgres-data-development:/var/lib/postgresql/data
    networks:
      - laravel-development

  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - laravel-development

networks:
  laravel-development:
    driver: bridge

volumes:
  postgres-data-development:
    driver: local
