version: '3.8'

services:
  app:
    # Direkomendasikan menggunakan image pre-built dari registry Anda.
    # Jika tetap ingin build lewat Dockhand, gunakan build context.
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app:dockhand
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./app:/var/www/app
      - ./bootstrap:/var/www/bootstrap
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./public:/var/www/public
      - ./resources:/var/www/resources
      - ./routes:/var/www/routes
      - ./tests:/var/www/tests
      # Menggunakan named volume untuk storage agar permission aman & persisten
      - laravel_storage:/var/www/storage 
    depends_on:
      - mysql
      - redis
    networks:
      - dockhand_laravel_net

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      # Hindari port 3000 (digunakan Dockhand) dan gunakan 8080 untuk host
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - dockhand_laravel_net

  mysql:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      # Variabel ini HARUS diisi di menu Environment Dockhand Web UI
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    volumes:
      - laravel_db_data:/var/lib/mysql
    networks:
      - dockhand_laravel_net

  redis:
    image: redis:alpine
    container_name: laravel_redis
    restart: unless-stopped
    volumes:
      - laravel_redis_data:/data
    networks:
      - dockhand_laravel_net

volumes:
  laravel_db_data:
  laravel_redis_data:
  laravel_storage: # Volume khusus untuk menangani isu permission storage

networks:
  dockhand_laravel_net:
    driver: bridge
